<!-- The inquiry-CTA band (spec 19 §5.2, the T5 replacement of spec 19
     §4.2): the page sections' link-only CTA — one inquiry link, one WhatsApp
     link and one reply promise.
     Styles: the md-inquiry-cta rules of the cta-band volume.

     This is a LINK band, not the form. Eighteen page sections include it
     (home, the family faces, shop, gallery, about, manufacturing,
     custom-screens, the series archive, blog-single), so it stays free of
     the form's markup. The footer's quote dialog is the single contextual
     form on these pages; another copy here would add a competing path.

     The place that needs pattern context at the point of intent is the
     footer's quote dialog, and that dialog places the md_inquiry_form shortcode directly
     (partials/footer.html) rather than this band. Do not swap this file's body
     for the form; change the dialog instead. -->
<div class="md-inquiry-cta">
	<a class="md-inquiry-cta__primary" href="#open-quote" data-quote-source="cta-band" data-source-module="cta-band" data-source-button="primary_cta">Request a quote</a>
	<a class="md-inquiry-cta__whatsapp" href="https://wa.me/85264731687?text=Hi%20Metal%20Divider%2C%20I%27d%20like%20a%20quote%20for%20stainless%20steel%20screens." target="_blank" rel="noopener">Send via WhatsApp</a>
	<p class="md-inquiry-cta__note">We reply with quote guidance within 24 hours.</p>
</div>
