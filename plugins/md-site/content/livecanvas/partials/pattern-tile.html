<div
                      class="pattern-item"
                      data-pattern-block-id="pattern-[md_pattern_id]"
                      data-pattern-name="[md_pattern_code]"
                      data-pattern-category="[md_pattern_context name=panel]"
                      >
                      <div class="pattern-main-card" role="button" tabindex="0" data-pattern-preview><img src="[md_pattern_image_url]"[md_pattern_square_srcset sizes="(min-width: 1025px) 181px, (min-width: 769px) 154px, (min-width: 641px) 174px, 113px"] alt="[md_pattern_code]" loading="lazy" width="[md_pattern_image_width]" height="[md_pattern_image_height]" class="pattern-image"><span class="pattern-preview-hint">Preview</span>
                      </div>[md_pattern_fragment name="tile-thumbs"]<div class="pattern-meta">
                        <a class="pattern-name" href="[md_pattern_permalink]">[md_pattern_code]</a>
                      </div>

                    </div>

                    <div id="pattern-lightbox-pattern-[md_pattern_id]" class="pattern-lightbox" aria-hidden="true" data-pattern-lightbox>
                      <div class="pattern-lightbox-backdrop" data-pattern-close></div>
                      <div class="pattern-lightbox-dialog" role="dialog" aria-modal="true" aria-label="[md_pattern_code] preview">
                        <button type="button" class="pattern-lightbox-close" data-pattern-close aria-label="Close preview">&times;</button>
                        <button type="button" class="pattern-lightbox-arrow pattern-lightbox-arrow--prev" data-pattern-prev aria-label="Previous image"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <div class="pattern-lightbox-stage">
                          <!-- The stage has no `src` until the dialog opens: `open()` calls `show(0)`,
       which assigns it from the active thumb. Shipping the first URL here
       downloaded every pattern's full-size preview on page load, while the
       dialog was still closed (measured 2026-10-27: /custom-metal-divider-screens/
       fetched 4.4MB of images at 390, most of it previews nobody had opened). -->
                          <img class="pattern-lightbox-image" data-pattern-main-image alt="[md_pattern_context name=first_alt]"[md_pattern_image_srcset sizes="(min-width: 900px) 900px, 100vw"] data-sizes="(min-width: 900px) 900px, 100vw" width="[md_pattern_image_width]" height="[md_pattern_image_height]">
                        </div>
                        <button type="button" class="pattern-lightbox-arrow pattern-lightbox-arrow--next" data-pattern-next aria-label="Next image"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        <div class="pattern-lightbox-meta">
                          <p class="pattern-lightbox-eyebrow">[md_pattern_context name=panel]</p>
                          <h3 class="pattern-lightbox-title">[md_pattern_code]</h3>
                          <p class="pattern-lightbox-count" data-pattern-count>1 / [md_pattern_context name=image_count]</p>
                        </div>
                        <div class="pattern-lightbox-strip" data-pattern-strip>[md_pattern_fragment name="tile-strip"]</div>
                      </div>
                    </div>
