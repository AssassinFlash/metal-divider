[project]
name = "md-media"
version = "0.1.0"
description = "Final media pipeline of metal-divider.com: local variants, WebP finals, sidecars (docs/specs/15-media-pipeline.md, branch research/spec-media-pipeline)."
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0,<14",
]

[project.scripts]
md-media = "md_media.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
# Range written by `uv init --package` with uv 0.13.4.
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting, bugbug and pyupgrade,
# as in tools/local (docs/specs/14-local-stack.md, branch research/spec-local-stack).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A deprecation is fixed when it appears, not when the API is removed.
filterwarnings = ["error"]
