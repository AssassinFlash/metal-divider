[project]
name = "md-migrate"
version = "0.1.0"
description = "The Shopify -> WordPress migration of metal-divider.com: 18-migrate.py drives seven stages through WP-CLI eval-file (spec 18, branch research/spec-migrator)."
# The Python of tools/local and tools/media (README.md, toolchain).
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# The driver runs as a file (uv run --project tools/migrate 18-migrate.py),
# not an installed package, like de-linker's tools/migrate.
package = false

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting, bugbear and pyupgrade,
# the same set as tools/local and tools/media.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
